[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hameau"
version = "0.1.0"
description = "HAMEAU - A village of 12-25 agents deciding fast with Strands Decider 2B and conversing via Amazon Bedrock (Nova Micro)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
    "strands-decider>=0.1.0",
    "strands-agents>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.scripts]
hameau = "hameau.cli:main"

[tool.setuptools.package-dir]
"" = "."
hameau = "src/hameau"
patterns = "patterns"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "defect_repro: Reproduction tests for audit defects",
]
